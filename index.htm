<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#050A14;color:#fff;overflow-x:hidden}
nav{position:fixed;top:0;width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px 6%;background:rgba(5,10,20,0.9);backdrop-filter:blur(20px);z-index:99;border-bottom:1px solid #00E5FF15}
nav img{height:40px;border-radius:50%}
.hero{height:100vh;position:relative;display:flex;align-items:flex-end;padding:0 6% 60px;background:#000;overflow:hidden}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.7}
.hero-content{position:relative;z-index:2}
.hero h1{font-size:11vw;line-height:.85;font-weight:900;letter-spacing:-4px}
.hero h1 span{color:#00E5FF}
.btn{margin-top:20px;display:inline-block;padding:16px 32px;background:#00E5FF;color:#000;border-radius:100px;font-weight:900;text-decoration:none;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#111}
.card{position:relative;height:55vh;overflow:hidden;background:#000}
.card img{width:100%;height:100%;object-fit:cover;transition:.6s}
.card:hover img{transform:scale(1.1)}
.card p{position:absolute;bottom:20px;left:20px;background:#000;padding:6px 14px;border-radius:100px;font-size:11px;letter-spacing:1px}
.robot-sec{height:90vh;display:grid;grid-template-columns:1fr 1fr}
.robot-sec img{width:100%;height:100%;object-fit:cover}
.robot-info{background:#00E5FF;display:flex;flex-direction:column;justify-content:center;padding:8%;color:#000}
.robot-info h2{font-size:5vw;line-height:.9;font-weight:900}
.footer{padding:60px 6%;background:#02060F;display:flex;justify-content:space-between;align-items:center}
@media(max-width:800px){.cards{grid-template-columns:1fr}.robot-sec{grid-template-columns:1fr;height:auto}.hero h1{font-size:18vw}}
</style>
</head>
